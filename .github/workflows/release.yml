name: Release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - run: go test ./...
      - run: ./scripts/release.sh "$GITHUB_REF_NAME"
      - name: Publish archives, checksums, and stable Homebrew formula
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.tar.gz dist/checksums.txt dist/locmonitor.rb --verify-tag --generate-notes
